<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="envGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer leaf shape -->
  <path d="M 50 10 Q 80 10 80 40 Q 80 70 50 90 Q 20 70 20 40 Q 20 10 50 10 Z" 
        fill="url(#envGradient)" opacity="0.2"/>
  
  <!-- Concentric circles (air quality waves) -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#envGradient)" stroke-width="3"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="url(#envGradient)" stroke-width="3"/>
  <circle cx="50" cy="50" r="14" fill="none" stroke="url(#envGradient)" stroke-width="3"/>
  
  <!-- Center leaf -->
  <path d="M 50 35 Q 55 40 55 50 L 50 55 L 45 50 Q 45 40 50 35 Z" 
        fill="url(#envGradient)"/>
  
  <!-- Leaf stem -->
  <rect x="48" y="50" width="4" height="15" fill="url(#envGradient)"/>
</svg>
